    <script src="https://telegram.org/js/telegram-web-app.js" defer></script><script>
(function () {
  setTimeout(function () {
    try {
      var path = window.location.pathname;
      if (!["/admin-panel", "/admin-panel/", "/admin", "/reseller"].includes(path)) return;
      var tg = window.Telegram && window.Telegram.WebApp;
      var initData = tg && tg.initData;
      if (!initData) return;
      var target = path === "/reseller" ? "reseller" : "admin";
      fetch("/api/role", { headers: { "Authorization": "tma " + initData } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (role) {
          if (!role) return;
          if (target === "admin" && role.role !== "admin") window.location.replace("/");
          if (target === "reseller" && role.role !== "reseller") window.location.replace("/");
        })
        .catch(function () {});
    } catch (_) {}
  }, 0);
})();
</script>
